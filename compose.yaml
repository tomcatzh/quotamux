services:
  quotamux:
    build:
      context: .
    image: quotamux:local
    container_name: quotamux
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      QUOTAMUX_DATA_DIR: /data
      RUST_LOG: quotamux=info
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./quotamux.toml:/config/quotamux.toml:ro
      - quotamux-data:/data

volumes:
  quotamux-data:
