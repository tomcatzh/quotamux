# QuotaMux version-two layered routing configuration.
# Copy this file to quotamux.toml and keep the populated file private.
config_version = 2

[server]
# Docker publishes this port on 127.0.0.1; QuotaMux listens on all container
# interfaces so OrbStack can forward the host port.
listen = "0.0.0.0:8080"
data_dir = "./data"

# Prefix affinity metadata is process-local and never written to redb.
[affinity]
checkpoint_bytes = 128
max_checkpoints_per_path = 4096
max_candidates_per_prefix = 8
max_leases = 16384
success_ttl_ms = 300000

# Provider definitions use exact upstream model IDs. Official provider kinds
# supply their standard endpoint unless endpoint is explicitly overridden.
[[providers]]
id = "opencode-go"
kind = "opencode-go"

[[providers.credentials]]
id = "go-plan"
api_key = ""

[[providers.models]]
name = "deepseek-v4-flash"
# OpenCode Go documents one endpoint family for each individual model.
endpoint_protocol = "openai-chat"
pricing = { cache_hit_input_usd_per_million = 0.0028, cache_miss_input_usd_per_million = 0.14, output_usd_per_million = 0.28 }

[[providers.models]]
name = "deepseek-v4-pro"
endpoint_protocol = "openai-chat"
pricing = { cache_hit_input_usd_per_million = 0.003625, cache_miss_input_usd_per_million = 0.435, output_usd_per_million = 0.87 }

[[providers]]
id = "deepseek"
kind = "deepseek-official"

[[providers.credentials]]
id = "deepseek-payg"
api_key = ""

[[providers.models]]
name = "deepseek-v4-flash"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]
pricing = { cache_hit_input_usd_per_million = 0.0028, cache_miss_input_usd_per_million = 0.14, output_usd_per_million = 0.28 }

[[providers.models]]
name = "deepseek-v4-pro"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]
pricing = { cache_hit_input_usd_per_million = 0.003625, cache_miss_input_usd_per_million = 0.435, output_usd_per_million = 0.87 }

# QuotaMux owns this public model name and its explicit compatibility alias.
[[models]]
name = "deepseek-v4-flash-0731"
aliases = ["deepseek-v4-flash"]
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]

# Layers are attempted in order. One target skips random/affinity work.
# Use strategy = "prompt-prefix-affinity" when a layer has multiple equivalent
# cache domains; the current single-target layer intentionally stays random.
[[models.layers]]
name = "plan"
strategy = "random"
targets = [
  { provider = "opencode-go", credential = "go-plan", model = "deepseek-v4-flash" },
]

[[models.layers]]
name = "payg"
strategy = "random"
targets = [
  { provider = "deepseek", credential = "deepseek-payg", model = "deepseek-v4-flash" },
]

[[models]]
name = "deepseek-v4-pro"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]

[[models.layers]]
name = "plan"
strategy = "random"
targets = [
  { provider = "opencode-go", credential = "go-plan", model = "deepseek-v4-pro" },
]

[[models.layers]]
name = "payg"
strategy = "random"
targets = [
  { provider = "deepseek", credential = "deepseek-payg", model = "deepseek-v4-pro" },
]
