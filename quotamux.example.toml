# QuotaMux version-three layered routing configuration.
# Copy this file to quotamux.toml and keep the populated file private.
config_version = 3

[server]
# Docker publishes this port on 127.0.0.1; QuotaMux listens on all container
# interfaces so OrbStack can forward the host port.
listen = "0.0.0.0:8080"
data_dir = "./data"

# Active upstream streams may legitimately pause during long reasoning. Keep
# their idle-read deadline separate from ordinary responses and from the total
# request deadline. QuotaMux emits downstream SSE comments while it waits.
[server.timeouts]
upstream_connect_ms = 10000
upstream_read_ms = 90000
upstream_stream_read_ms = 300000
upstream_total_ms = 7200000
downstream_sse_heartbeat_ms = 15000

# Prefix affinity metadata is process-local and never written to redb.
[affinity]
checkpoint_bytes = 128
max_checkpoints_per_path = 4096
max_candidates_per_prefix = 8
max_leases = 16384
success_ttl_ms = 300000

# Backend definitions use exact upstream model IDs. Official adapters own their
# endpoint; choose a custom-* adapter when supplying a customer URL.
[[backends]]
id = "opencode-go"
adapter = "opencode-go"

[[backends.credentials]]
id = "go-plan"
api_key = ""

[[backends.models]]
name = "deepseek-v4-flash"
# The OpenCode Go adapter owns this official model's endpoint family.
# Static cost estimates use current off-peak rates; peak rates are 2x.
pricing = { cache_hit_input_usd_per_million = 0.007, cache_miss_input_usd_per_million = 0.22, output_usd_per_million = 0.66 }

[[backends.models]]
name = "deepseek-v4-flash-vision-exp"
pricing = { cache_hit_input_usd_per_million = 0.007, cache_miss_input_usd_per_million = 0.22, output_usd_per_million = 0.66 }

[[backends.models]]
name = "deepseek-v4-pro"
pricing = { cache_hit_input_usd_per_million = 0.022, cache_miss_input_usd_per_million = 0.66, output_usd_per_million = 1.98 }

[[backends]]
id = "deepseek"
adapter = "deepseek-official"

[[backends.credentials]]
id = "deepseek-payg"
api_key = ""

[[backends.models]]
name = "deepseek-v4-flash"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]
pricing = { cache_hit_input_usd_per_million = 0.007, cache_miss_input_usd_per_million = 0.22, output_usd_per_million = 0.66 }

[[backends.models]]
name = "deepseek-v4-flash-vision-exp"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]
pricing = { cache_hit_input_usd_per_million = 0.007, cache_miss_input_usd_per_million = 0.22, output_usd_per_million = 0.66 }

[[backends.models]]
name = "deepseek-v4-pro"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]
pricing = { cache_hit_input_usd_per_million = 0.022, cache_miss_input_usd_per_million = 0.66, output_usd_per_million = 1.98 }

# QuotaMux owns this public model name and its explicit compatibility alias.
[[models]]
name = "deepseek-v4-flash-0731"
aliases = ["deepseek-v4-flash"]
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]

# Layers are attempted in order. One target skips random/affinity work.
# Use strategy = "prompt-prefix-affinity" when a layer has multiple equivalent
# cache domains; the current single-target layer intentionally stays random.
[[models.layers]]
name = "plan"
strategy = "random"
targets = [
  { backend = "opencode-go", credential = "go-plan", model = "deepseek-v4-flash" },
]

[[models.layers]]
name = "payg"
strategy = "random"
targets = [
  { backend = "deepseek", credential = "deepseek-payg", model = "deepseek-v4-flash" },
]

[[models]]
name = "deepseek-v4-flash-vision-exp"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]

[[models.layers]]
name = "plan"
strategy = "random"
targets = [
  { backend = "opencode-go", credential = "go-plan", model = "deepseek-v4-flash-vision-exp" },
]

[[models.layers]]
name = "payg"
strategy = "random"
targets = [
  { backend = "deepseek", credential = "deepseek-payg", model = "deepseek-v4-flash-vision-exp" },
]

[[models]]
name = "deepseek-v4-pro"
protocols = ["openai-chat", "openai-responses", "anthropic-messages"]

[[models.layers]]
name = "plan"
strategy = "random"
targets = [
  { backend = "opencode-go", credential = "go-plan", model = "deepseek-v4-pro" },
]

[[models.layers]]
name = "payg"
strategy = "random"
targets = [
  { backend = "deepseek", credential = "deepseek-payg", model = "deepseek-v4-pro" },
]
