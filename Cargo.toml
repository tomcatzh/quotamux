[package]
name = "quotamux"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "A quota-aware local gateway for DeepSeek V4"
repository = "https://github.com/tomcatzh/quotamux"

[features]
default = []
test-support = []
standalone-tls = ["dep:aws-smithy-http-client"]

[dependencies]
async-stream = "0.3.6"
aws-config = { version = "1.13.2", default-features = false, features = ["rt-tokio", "default-https-client", "credentials-process"] }
aws-sdk-bedrockruntime = "1.155.0"
aws-sdk-sts = { version = "1.126.0", default-features = false, features = ["default-https-client", "rt-tokio", "rustls"] }
aws-credential-types = "1.3.1"
aws-smithy-http-client = { version = "1.5.2", optional = true, default-features = false, features = ["rustls-aws-lc"] }
axum = { version = "0.8.9", features = ["http1", "http2", "json", "tokio"] }
bytes = "1.11.1"
blake3 = "1.8.5"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.6", features = ["derive", "env"] }
futures-util = "0.3.33"
getrandom = "0.4.3"
httpdate = "1.0.3"
embedded-spa = { git = "https://github.com/tomcatzh/embedded-spa", tag = "v0.1.1" }
redb = "4.1.0"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "http2", "json", "stream"] }
rust-embed = { version = "8", features = ["debug-embed", "deterministic-timestamps"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

tower = { version = "0.5.3", features = ["util"] }

[dev-dependencies]
tempfile = "3.27.0"

[[test]]
name = "gateway_integration"
path = "tests/gateway_integration.rs"
required-features = ["test-support"]

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "symbols"
